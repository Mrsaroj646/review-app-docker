<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movie Review App</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <h1>🎬 Movie Review App</h1>
    <p>Share your movie reviews, then ask the AI assistant for recommendations.</p>
  </header>

  <main class="grid">
    <!-- Reviews panel -->
    <section class="card">
      <h2>Add a review</h2>
      <form id="reviewForm">
        <label for="title">Movie title</label>
        <input id="title" maxlength="100" placeholder="e.g. Inception" required>

        <label for="rating">Rating</label>
        <select id="rating">
          <option value="5">★★★★★ (5)</option>
          <option value="4">★★★★☆ (4)</option>
          <option value="3">★★★☆☆ (3)</option>
          <option value="2">★★☆☆☆ (2)</option>
          <option value="1">★☆☆☆☆ (1)</option>
        </select>

        <label for="text">Your review</label>
        <textarea id="text" rows="3" maxlength="1000" placeholder="What did you think?"></textarea>

        <button type="submit">Submit review</button>
        <p id="formError" class="error" role="alert"></p>
      </form>

      <h2>Reviews</h2>
      <div id="reviews" class="reviews"><p class="muted">Loading...</p></div>
    </section>

    <!-- Chat panel -->
    <section class="card">
      <h2>AI movie assistant</h2>
      <div id="chatLog" class="chat-log" aria-live="polite"></div>
      <form id="chatForm" class="chat-form">
        <input id="chatInput" placeholder="e.g. Suggest a movie for family night" autocomplete="off">
        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    Built with Node.js, Express, MongoDB and Ollama &middot; Run with Docker Compose
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
